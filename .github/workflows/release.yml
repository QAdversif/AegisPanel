# SPDX-License-Identifier: AGPL-3.0-or-later
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # The image tag to publish. For tag-push events this is the
    # pushed tag (e.g. `v0.4.0`); for `workflow_dispatch` re-runs
    # the operator supplies the tag via the `tag` input. Both
    # branches need to converge on a single tag value so the
    # UI image and the panel semver tags end up on the same ref.
    env:
      release_tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    # Service containers for the smoke-test step (Tier 1 item #1 of
    # `docs/gap-analysis-v0.8.24.md`). The smoke step itself is
    # currently `if: false` (gated off until the
    # `tools/scripts/smoke-test-env.enc.env` sops+age fixture
    # lands in a follow-up PR), so the service container is
    # provisioned but not exercised; flipping the step to
    # `if: true` is a one-liner once the fixture is committed.
    # The `postgres` hostname below is the GitHub Actions
    # service-alias — that's the host the panel's
    # `AEGIS_POSTGRES_DSN` reaches.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis
          POSTGRES_DB: aegis_smoke
        ports:
          - 5432:5432
        # health-cmd is required — without it, GitHub Actions
        # marks the service as "ready" before postgres actually
        # accepts connections. `pg_isready -U aegis` exits 0 the
        # moment pg is up and accepting auth, so the smoke
        # step's `pg_isready` retry loop terminates as soon as
        # the panel can connect.
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show tag
        run: |
          echo "tag = ${{ github.ref_name }}"
          echo "release_tag = ${{ env.release_tag }}"
          git tag --list 'v*' | sort -V

      # Compute the bare semver components from `release_tag`
      # (e.g. `v0.4.0` → version=`0.4.0`, short=`0.4`). Used
      # by the panel metadata-action so the generated tags
      # (`0.4.0`, `0.4`) match the existing convention (no
      # `v` prefix) on both the tag-push and the
      # `workflow_dispatch` re-run paths. With the
      # `type=semver,pattern={{version}}` form, the action
      # only derives a version from the ref on tag-push
      # events; on `workflow_dispatch` it sees the branch
      # ref and emits no semver tags — leaving `0.4.0` /
      # `0.4` pointing at whatever was last pushed by an
      # older workflow run. We compute the components
      # explicitly here so both paths produce the same
      # tag list.
      - name: Compute release version
        id: rel
        run: |
          raw="${{ env.release_tag }}"
          version="${raw#v}"
          short="$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')"
          echo "tag=${raw}"     >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "Computed: tag=${raw} version=${version} short=${short}"

      # Build the panel image.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Install cosign for the post-push signing steps below.
      # The workflow already has `id-token: write` permission
      # at the job level, so the keyless OIDC flow works
      # against the GitHub Actions OIDC issuer.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract version metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/qadversif/aegispanel
          tags: |
            type=raw,value=${{ steps.rel.outputs.version }}
            type=raw,value=${{ steps.rel.outputs.short }}
            type=raw,value=latest,enable=${{ !contains(steps.rel.outputs.version, '-') }}
          # The raw `latest` rule above is the canonical
          # source of truth for the `latest` tag. It fires
          # for any non-prerelease version (no `-` in
          # `steps.rel.outputs.version`), on BOTH the
          # tag-push path AND the workflow_dispatch
          # re-run path. The previous `flavor:
          # latest=auto` + `enable={{is_default_branch}}`
          # combo only fired `latest` on workflow_dispatch
          # from main; tag-push leaked `latest` to a stale
          # digest (see v0.5.0: 0.5.0/0.5 emitted, latest
          # stayed on v0.4.0's digest). `flavor:
          # latest=auto` removed because the raw rule
          # covers the only case that matters (non-prerelease
          # versions on any event).

      - name: Build and push panel image
        id: build_panel
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push UI image
        id: build_ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/qadversif/aegispanel-ui:${{ env.release_tag }}
          build-args: |
            VITE_API_BASE=/api
            VITE_VERSION=${{ steps.rel.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Smoke-test gate (Tier 1 item #1 of `docs/gap-analysis-v0.8.24.md`).
      # Runs AFTER the panel + UI images are built and pushed, BEFORE the
      # cosign re-sign step. If any smoke substep fails, the job exits 1
      # and the images remain unsigned (the cosign re-sign never runs);
      # the `Create GitHub release` step is also gated on all prior
      # steps passing, so a release tag on a broken image is impossible.
      #
      # GATED OFF (`if: false`) until `tools/scripts/smoke-test-env.enc.env`
      # lands in a follow-up PR. The env vars below are HARDCODED
      # placeholders (`<dev-mode fixture>`); they are NOT real secrets
      # — the literal banned values live in the operator's
      # `~/.aegis/deploy.local.md` (out of repo) and never appear here.
      # Flipping `if: false` → `if: true` is a one-liner once the
      # sops+age-encrypted env fixture is committed (the fixture will
      # carry the real dev-mode values + a known age recipient; the
      # workflow decrypts it via the sops+age action).
      #
      # The smoke covers the 3 categories of the v0.8.15..v0.8.25
      # silent-bug chain (per `KNOWN_LIMITATIONS.md` §"v0.8.16..v0.8.25"):
      #   1. distroless + symlink + Dockerfile multi-stage failures
      #      → substep (e) `pg_dump --version` + (f) ELF magic check
      #   2. SSH provision path failures
      #      → substep (h)/(i) backup create + on-disk assertion
      #   3. secret-decryption-on-operator workflow gap
      #      → substep (g) login + JWT round-trip
      - name: Smoke test panel image
        if: false
        env:
          PANEL_IMAGE: ghcr.io/qadversif/aegispanel@${{ steps.build_panel.outputs.digest }}
          AEGIS_POSTGRES_DSN: postgres://aegis:aegis@postgres:5432/aegis_smoke?sslmode=disable
          AEGIS_AUTH_BACKEND: pg
          AEGIS_HOSTS_BACKEND: pg
          AEGIS_NODES_BACKEND: pg
          AEGIS_INBOUNDS_BACKEND: pg
          AEGIS_SUBSCRIPTION_BACKEND: pg
          AEGIS_USERS_BACKEND: pg
          AEGIS_PLANS_BACKEND: pg
          AEGIS_WEBHOOKS_BACKEND: pg
          AEGIS_AUDITS_BACKEND: pg
          AEGIS_CREDENTIALS_BACKEND: pg
          AEGIS_INBOUND_TEMPLATES_BACKEND: pg
          AEGIS_SECRETS_BACKEND: sops
          AEGIS_SOPS_AGE_RECIPIENTS: "<dev-mode fixture>"
          AEGIS_SOPS_AGE_KEY_FILE: /run/secrets/age.key
          AEGIS_JWT_SECRET: "<dev-mode fixture>"
          AEGIS_ADMIN_BOOTSTRAP_USERNAME: admin
          AEGIS_ADMIN_BOOTSTRAP_PASSWORD: "<dev-mode fixture>"
          AEGIS_PANEL_PATH: /
          AEGIS_DECOY_ROOT: /tmp/smoke-decoy
          AEGIS_LISTEN: ":8080"
          AEGIS_ENV: development
        run: |
          set -euo pipefail

          # ----- (a) Wait for the `postgres` service to be ready. -----
          # (Declared at job level via the `services:` block above.)
          echo "==> [a] Waiting for postgres services container"
          for i in $(seq 1 30); do
            if pg_isready -h postgres -U aegis -d aegis_smoke >/dev/null 2>&1; then
              echo "  postgres OK after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SMOKE TEST FAILED: postgres did not become ready within 30s" >&2
              exit 1
            fi
            sleep 1
          done

          # ----- (b/c) Start the panel container from the just-built
          # image. /tmp/smoke-decoy is created on-the-fly (per the
          # parent brief); /tmp/smoke-backups is bind-mounted at
          # /var/lib/aegis/backups so the smoke can assert the
          # backup file landed on disk. The panel image is distroless
          # so no shell is available inside the container — we exec
          # binaries directly (`/usr/bin/pg_dump`, `stat`, `ls`, etc.)
          # via `docker exec` and let the host's `sh` handle the
          # pipeline. -----
          echo "==> [b/c] Starting panel container from just-built image"
          echo "  image = ${PANEL_IMAGE}"
          mkdir -p /tmp/smoke-decoy /tmp/smoke-backups
          docker run -d \
            --name aegis-panel-smoke \
            --restart no \
            -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /tmp/smoke-backups:/var/lib/aegis/backups \
            -e AEGIS_POSTGRES_DSN \
            -e AEGIS_AUTH_BACKEND \
            -e AEGIS_HOSTS_BACKEND \
            -e AEGIS_NODES_BACKEND \
            -e AEGIS_INBOUNDS_BACKEND \
            -e AEGIS_SUBSCRIPTION_BACKEND \
            -e AEGIS_USERS_BACKEND \
            -e AEGIS_PLANS_BACKEND \
            -e AEGIS_WEBHOOKS_BACKEND \
            -e AEGIS_AUDITS_BACKEND \
            -e AEGIS_CREDENTIALS_BACKEND \
            -e AEGIS_INBOUND_TEMPLATES_BACKEND \
            -e AEGIS_SECRETS_BACKEND \
            -e AEGIS_SOPS_AGE_RECIPIENTS \
            -e AEGIS_SOPS_AGE_KEY_FILE \
            -e AEGIS_JWT_SECRET \
            -e AEGIS_ADMIN_BOOTSTRAP_USERNAME \
            -e AEGIS_ADMIN_BOOTSTRAP_PASSWORD \
            -e AEGIS_PANEL_PATH \
            -e AEGIS_DECOY_ROOT \
            -e AEGIS_LISTEN \
            -e AEGIS_ENV \
            "${PANEL_IMAGE}"

          # On any failure below, dump the panel log + cleanup the
          # container so the runner does not leave a zombie.
          trap 'echo "--- last 80 lines of aegis-panel-smoke log ---" >&2; docker logs aegis-panel-smoke 2>&1 | tail -80 >&2 || true; docker stop aegis-panel-smoke 2>/dev/null || true; docker rm aegis-panel-smoke 2>/dev/null || true' EXIT

          # ----- (d) Wait for /api/v1/health to return 200. -----
          echo "==> [d] Waiting for /api/v1/health"
          HEALTH_URL="http://127.0.0.1:8080/api/v1/health"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)"
            if [ "$code" = "200" ]; then
              echo "  health OK after ${i}s (200)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "SMOKE TEST FAILED: /api/v1/health did not return 200 within 30s (last code=$code)" >&2
              exit 1
            fi
            sleep 1
          done

          # ----- (e) /usr/bin/pg_dump --version inside the panel. -----
          # Catches the v0.8.16 shell-symlink `pg_wrapper` bug — if
          # `pg_dump` is a shell script or symlink to `pg_wrapper`,
          # the exit code may be 0 but the binary is wrong.
          echo "==> [e] docker exec /usr/bin/pg_dump --version"
          if ! docker exec aegis-panel-smoke /usr/bin/pg_dump --version; then
            echo "SMOKE TEST FAILED: /usr/bin/pg_dump --version exited non-zero (catches v0.8.16 shell-symlink bug)" >&2
            exit 1
          fi

          # ----- (f) /app/bin/aegis-agent ELF magic check. -----
          # Catches the v0.8.15 missing-build-artifact bug. The first
          # 4 bytes of a real ELF binary are `7f 45 4c 46` (0x7f 'E' 'L' 'F').
          echo "==> [f] docker exec ls -la /app/bin/aegis-agent + ELF magic check"
          if ! docker exec aegis-panel-smoke ls -la /app/bin/aegis-agent; then
            echo "SMOKE TEST FAILED: /app/bin/aegis-agent does not exist" >&2
            exit 1
          fi
          MAGIC="$(docker exec aegis-panel-smoke sh -c 'head -c 4 /app/bin/aegis-agent' | od -An -tx1 | tr -d ' \n')"
          if [ "$MAGIC" != "7f454c46" ]; then
            echo "SMOKE TEST FAILED: /app/bin/aegis-agent does not start with ELF magic (got '$MAGIC', expected '7f454c46')" >&2
            exit 1
          fi
          echo "  aegis-agent ELF magic OK ($MAGIC)"

          # ----- (g) Login as the seeded admin + save JWT. -----
          # Catches the v0.8.x secret-decryption-on-operator gap
          # (the smoke proves the sops envelope decrypts AND the
          # seeded creds round-trip end-to-end through /auth/login).
          echo "==> [g] POST /api/v1/auth/login (sops envelope + seeded creds)"
          LOGIN_BODY="$(curl -sf -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${AEGIS_ADMIN_BOOTSTRAP_USERNAME}\",\"password\":\"${AEGIS_ADMIN_BOOTSTRAP_PASSWORD}\"}" \
            "${HEALTH_URL%/health}/auth/login")"
          JWT="$(printf '%s' "$LOGIN_BODY" | jq -er '.access_token // .token // .jwt // empty')"
          if [ -z "$JWT" ]; then
            echo "SMOKE TEST FAILED: no JWT in login response: $LOGIN_BODY" >&2
            exit 1
          fi
          echo "  login OK (token length=${#JWT})"

          # ----- (h) POST /api/v1/backups/ (manual trigger). -----
          # Catches the v0.8.x backup-API codepath regression — the
          # smoke proves the panel accepts a manual trigger AND
          # writes a backup file to disk.
          echo "==> [h] POST /api/v1/backups/ (trigger=manual)"
          BACKUP_BODY="$(curl -sf -X POST \
            -H "Authorization: Bearer $JWT" \
            -H 'Content-Type: application/json' \
            -d '{"trigger":"manual"}' \
            "${HEALTH_URL%/health}/backups/")"
          BACKUP_ID="$(printf '%s' "$BACKUP_BODY" | jq -er '.id // .backup_id // empty')"
          if [ -z "$BACKUP_ID" ]; then
            echo "SMOKE TEST FAILED: no backup id in response: $BACKUP_BODY" >&2
            exit 1
          fi
          echo "  backup created id=$BACKUP_ID"

          # ----- (i) /var/lib/aegis/backups/ has a non-empty file. -----
          # Catches the v0.8.18 33-byte empty-dump bug — the bug was
          # that the panel called pg_dump correctly but the file
          # on disk was 33 bytes (the "PostgreSQL 16.x..." header
          # only, with no data). We assert size > 1024 to give
          # margin against the smallest legitimate dump.
          echo "==> [i] docker exec ls -la /var/lib/aegis/backups/ (assert size > 1024)"
          sleep 2
          docker exec aegis-panel-smoke ls -la /var/lib/aegis/backups/
          BACKUP_FILE="$(docker exec aegis-panel-smoke sh -c 'ls -1 /var/lib/aegis/backups/ | head -1')"
          if [ -z "$BACKUP_FILE" ]; then
            echo "SMOKE TEST FAILED: /var/lib/aegis/backups/ is empty" >&2
            exit 1
          fi
          SIZE="$(docker exec aegis-panel-smoke stat -c '%s' "/var/lib/aegis/backups/$BACKUP_FILE")"
          if [ "$SIZE" -le 1024 ]; then
            echo "SMOKE TEST FAILED: backup file $BACKUP_FILE is ${SIZE} bytes (must be > 1024; catches v0.8.18 empty-dump bug)" >&2
            exit 1
          fi
          echo "  backup file $BACKUP_FILE = ${SIZE} bytes (> 1024 OK)"

          # ----- (j) Cleanup. -----
          echo "==> [j] docker stop + rm aegis-panel-smoke"
          docker stop aegis-panel-smoke >/dev/null
          docker rm aegis-panel-smoke >/dev/null
          trap - EXIT
          echo "==> smoke-test OK"

      # Sign the panel image by its actual digest (NOT by
      # tag) — the digest is what the signature is bound
      # to. Using the tag would also work, but signing by
      # digest is the most precise: the signature is
      # unambiguously attached to one specific image
      # manifest, regardless of any future tag moves.
      # The `id-token: write` job permission above enables
      # cosign's keyless OIDC flow against the GitHub
      # Actions issuer.
      - name: Sign panel image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/qadversif/aegispanel@${{ steps.build_panel.outputs.digest }}

      - name: Sign UI image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/qadversif/aegispanel-ui@${{ steps.build_ui.outputs.digest }}

      # Re-sign and verify each image after a 30s settle
      # delay. The first sign (above) fires immediately
      # after the buildx push; the re-sign below covers
      # three concrete failure modes that hit us in the
      # v0.8.8 release (PR #189):
      #
      # 1. **Tag-mutation drift** — buildx publishes one
      #    manifest and tags it 0.8.9 / 0.8 / latest in
      #    one shot. If `latest` is re-tagged between sign
      #    and consumer pull (manual override, post-release
      #    hotfix re-tag), the original sign is bound to
      #    the OLD digest. Re-sign with the build's recorded
      #    digest emits a fresh transparency-log entry
      #    keyed to the digest the tags actually resolve to
      #    at sign time.
      #
      # 2. **Sign-step flake recovery** — the v0.8.8 first
      #    release run failed at GHCR buildx push with
      #    `denied: denied` (transient OIDC). The re-sign
      #    here is a second cosign sign attempt without
      #    forcing a full workflow_dispatch + rebuild — if
      #    the first sign OIDC-flaked, re-sign will succeed
      #    on retry, and the verify step proves it.
      #
      # 3. **Audit trail in workflow log** — every release
      #    now has explicit `cosign verify` output proving
      #    the signature validates against the published
      #    digest. Without this, a successful `sign` exit 0
      #    doesn't guarantee the consumer can verify the
      #    same image later (Rekor inclusion can fail
      #    silently if the OIDC token is stale).
      #
      # The 30s sleep is empirical: GHCR OIDC token refresh
      # can take 10-20s on cold cache; 30s gives margin
      # without blowing the release budget (v0.8.8 ran
      # in 2m47s with the 30s sleep added).
      - name: Settle GHCR after push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: sleep 30

      - name: Re-sign and verify panel image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/qadversif/aegispanel@${{ steps.build_panel.outputs.digest }}
          cosign verify \
            --certificate-identity-regexp "https://github.com/QAdversif/AegisPanel/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/qadversif/aegispanel@${{ steps.build_panel.outputs.digest }}

      - name: Re-sign and verify UI image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/qadversif/aegispanel-ui@${{ steps.build_ui.outputs.digest }}
          cosign verify \
            --certificate-identity-regexp "https://github.com/QAdversif/AegisPanel/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/qadversif/aegispanel-ui@${{ steps.build_ui.outputs.digest }}

      # Create a GitHub release with auto-generated notes (uses the
      # conventional-commits PR titles we already produce).
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
