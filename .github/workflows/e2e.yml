name: e2e

# Playwright E2E test suite for the Aegis admin
# UI. Runs against the prod panel (the v0.8.28
# dropdowns-regression guard). Triggered:
#   - manually via workflow_dispatch
#   - nightly at 03:00 UTC (catches prod-side
#     regressions that the unit / integration
#     tests miss)
#
# This workflow does NOT run on every PR because
# it depends on the prod panel being reachable
# from the GitHub Actions runner (the runner is
# on the public internet) AND on a known admin
# password (stored in GitHub Actions secrets).
# The vitest unit tests + the regression tests
# in styles.test.ts / Select.test.ts cover the
# build-time contract; this workflow covers the
# runtime / visual contract.
#
# Required GitHub Actions secrets:
#   E2E_ADMIN_PASSWORD   the prod admin password
#                         (from 1Password "AegisPanel
#                         / Live / admin")
#   PANEL_BASE_URL       the prod panel URL (no
#                         path), e.g. "host.example.com"
#                         (no scheme, no trailing slash).
#                         Used to compose E2E_BASE_URL.
#                         The 1Password entry is the
#                         same one that backs the manual
#                         browser smoke (see operator-guide
#                         §"Browser smoke"). The smoke
#                         step below fails fast with a
#                         precise diagnostic if either
#                         secret is missing.
#
# The dev docker-compose stack path (with a
# fresh seed admin) is supported via the
# `compose` input - set to 'true' to bring up
# the dev stack first (postgres + redis + nats +
# the Go panel) and run the suite against
# http://localhost:8080. Default is 'false' (run
# against prod).
#
# Known failure mode (2026-08-25): the workflow was
# failing on tag pushes (v0.8.31.0, v0.8.31.1, v0.8.32)
# with `conclusion: failure` and no log artifact (logs
# returned 404 from the actions API). The most likely
# cause is a stale E2E_ADMIN_PASSWORD secret after
# the prod admin password rotation that the v0.8.31.1
# install contract requires. The smoke-check step
# added in v0.8.32.1 turns the silent failure into a
# named-secret error; the operator-side fix is to
# re-set the GitHub secret from the 1Password
# "AegisPanel / Live / admin" entry.

on:
  workflow_dispatch:
    inputs:
      compose:
        description: 'Bring up the dev docker-compose stack first'
        type: boolean
        default: false
  schedule:
    # Nightly at 03:00 UTC. Catches prod-side
    # regressions (Caddyfile overrides, cert
    # renewals, the bfcache behaviour, etc.) that
    # the build-time contract tests miss.
    - cron: '0 3 * * *'

# Cancel any in-flight run for the same ref.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # The prod panel URL is the placeholder
  # `<prod-host>/<sub-path>`; the operator
  # overrides it via the E2E_BASE_URL secret
  # at workflow time. We do NOT hardcode the
  # public hostname in this workflow file
  # because the secret-scan pattern blocks
  # it (see AGENTS.md "Banned patterns").
  # The default below points at the dev
  # docker-compose stack (used when the
  # `compose` input is true).
  E2E_BASE_URL: ${{ inputs.compose == true && 'http://localhost:8080' || format('https://{0}', secrets.PANEL_BASE_URL) }}
  E2E_NO_WEBSERVER: '1'
  E2E_ADMIN_USERNAME: admin

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v0.8.32.1 ci-hygiene hotfix: fail-fast smoke check
      # on the two secrets the workflow depends on. The
      # pre-fix behaviour was a silent Playwright auth
      # failure when E2E_ADMIN_PASSWORD was rotated on
      # the prod side but the GitHub Actions secret was
      # forgotten — Playwright would log in, get a 401,
      # and the test report would surface a generic
      # Playwright timeout, not the "secret stale" cause.
      # The smoke step fails the job with a precise
      # diagnostic so the operator can re-set the
      # secret from 1Password in 30 seconds.
      - name: Smoke-check required secrets
        if: ${{ inputs.compose != true }}
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${E2E_BASE_URL:?E2E_BASE_URL is unset (PANEL_BASE_URL secret is missing or empty; the workflow cannot reach the prod panel)}"
          : "${E2E_ADMIN_PASSWORD:?E2E_ADMIN_PASSWORD secret is missing or empty; rotate the 1Password entry and re-set the GitHub Actions secret before the next run}"
          : "${E2E_ADMIN_USERNAME:?E2E_ADMIN_USERNAME env is unset (this is a workflow bug, not an operator action)}"
          echo "secrets smoke: E2E_BASE_URL=$(echo "$E2E_BASE_URL" | sed -E 's#https?://##; s#^[^@]+@##; s#:[0-9]+/?.*##') E2E_ADMIN_USERNAME=$E2E_ADMIN_USERNAME (password length=${#E2E_ADMIN_PASSWORD})"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend deps + Playwright
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Bring up dev stack (conditional)
        if: ${{ inputs.compose == true }}
        run: |
          cp deploy/docker/.env.example deploy/docker/.env
          # Patch the .env to use the dev seed
          # admin password (aegis-fixture-admin-password)
          # - the same one the Go CLI uses for the
          # dev fixture admin.
          sed -i 's/^AEGIS_JWT_SECRET=.*/AEGIS_JWT_SECRET=dev-stack-jwt-secret-32-bytes-min/' deploy/docker/.env
          cd deploy/docker
          docker compose -f docker-compose.dev.yml up -d
          # Wait for the Go panel to be ready.
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/health 2>/dev/null; then
              echo "panel ready"
              break
            fi
            sleep 2
          done

      - name: Run Playwright
        run: |
          cd frontend
          pnpm e2e
        env:
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_NO_WEBSERVER: '1'
          E2E_ADMIN_USERNAME: admin

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 3

      - name: Tear down dev stack (conditional)
        if: ${{ always() && inputs.compose == true }}
        run: |
          cd deploy/docker
          docker compose -f docker-compose.dev.yml down -v
        ignore-error: true
