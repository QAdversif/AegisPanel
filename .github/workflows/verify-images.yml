# SPDX-License-Identifier: AGPL-3.0-or-later
name: verify-images

on:
  # Run after every release workflow completes. The trigger
  # is a `workflow_run` event — fires once the upstream
  # workflow's `release` job has finished, regardless of
  # success. The verify step inside this workflow filters
  # on `conclusion == 'success'` so a failed release does
  # not produce a spurious verify failure (the signature
  # was never written).
  workflow_run:
    workflows: [release]
    types: [completed]
  # Manual trigger: re-verify the most recent tag (or a
  # specific one via inputs.tag). Useful when an operator
  # wants to confirm a signature outside the release cycle.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (default: latest versioned tag from git describe)"
        required: false
  # Weekly schedule: silent breakage detector. If a
  # signature is ever lost (e.g. someone deletes the OOB
  # signature in GHCR), the verify fails and we find out
  # within a week. The schedule is Mon 06:00 UTC (low
  # traffic window).
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: verify cosign signatures
    runs-on: ubuntu-latest
    # The OIDC identity in a cosign keyless Fulcio cert is
    # bound to the workflow FILE + REF + SHA. The release
    # workflow can be legitimately triggered from TWO
    # different ref paths:
    #
    #   1. tag-push event           → refs/tags/vX.Y.Z
    #   2. workflow_dispatch        → refs/heads/main (or the
    #                                  branch the dispatch was
    #                                  triggered from; in
    #                                  practice always `main`)
    #
    # Both paths produce a fully-trustworthy signature —
    # the cert still binds to OUR release workflow, not to
    # some random PR. The regex accepts BOTH paths so
    # re-runs (dispatch) don't false-fail. v0.5.0 doesn't
    # have a `heads/main` release yet, so accept all `heads/*`
    # for now; tighten later if we ever trigger release from
    # a non-default branch.
    env:
      PANEL_IMAGE: ghcr.io/qadversif/aegispanel
      UI_IMAGE: ghcr.io/qadversif/aegispanel-ui
      IDENTITY_REGEXP: '^https://github.com/QAdversif/AegisPanel/\.github/workflows/release\.yml@refs/(tags/v[0-9]+\.[0-9]+\.[0-9]+.*|heads/.+)$'
      OIDC_ISSUER: 'https://token.actions.githubusercontent.com'
    steps:
      - name: Skip when release failed
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "::notice::Upstream release workflow did not succeed (conclusion=${{ github.event.workflow_run.conclusion }}); skipping verify."

      - name: Checkout repo
        # Required by `git describe --tags` to find the
        # most recent versioned tag. The default checkout
        # fetches a single ref, not all tags, so describe
        # would return "fatal: No names found" without
        # `fetch-tags: true`.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Resolve the tag to verify. Sources, in order:
      #   1. workflow_dispatch input (operator override)
      #   2. workflow_run head_branch (the tag for tag-push
      #      events, or `main` for dispatch re-runs — we
      #      fall through to git describe in the latter
      #      case because the panel image is not tagged
      #      `main`)
      #   3. git describe --tags --abbrev=0 (most recent
      #      versioned tag for dispatch re-runs and the
      #      weekly schedule)
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]] && [[ "${{ github.event.workflow_run.head_branch }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # tag-push event: head_branch IS the tag.
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_run from workflow_dispatch (head_branch = main,
            # which is not an image tag), or the weekly schedule.
            # Use the most recent versioned tag.
            tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [[ -z "$tag" ]]; then
              echo "::error::No versioned tag found in repo; cannot verify"
              exit 1
            fi
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi
          echo "Verifying tag: ${{ steps.tag.outputs.tag }}"

      - name: Verify panel image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The panel image is tagged with bare semver
          # (e.g. 0.5.0, not v0.5.0); the UI image keeps the
          # 'v' prefix.
          panel_tag="${TAG#v}"
          echo "Verifying ${PANEL_IMAGE}:${panel_tag}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "${PANEL_IMAGE}:${panel_tag}"

      - name: Verify UI image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Verifying ${UI_IMAGE}:${TAG}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "${UI_IMAGE}:${TAG}"
