# SPDX-License-Identifier: AGPL-3.0-or-later
#
# secret-scan.yml — the CI gate for sensitive-data leaks.
# Runs tools/scripts/check-sensitive.sh on every PR diff
# (and on every push to main, for defence in depth).
#
# Branch protection on `main` MUST require this check
# before merge. See:
#   https://github.com/QAdversif/AegisPanel/settings/branches
#
# The scanner enforces the contract in AGENTS.md
# §"Banned patterns". Adding a new secret to the contract
# requires a PR that updates both AGENTS.md and the
# BANNED_PATTERNS array in check-sensitive.sh in the SAME
# commit; this workflow will then block any subsequent
# commit that re-introduces the value.

name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full-tree scan. Surfaces historical leaks that
    # pre-date the gate without blocking merge. Visible as
    # a workflow failure; triage manually.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  scan-pr:
    name: scan PR diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan diff against base branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: bash tools/scripts/check-sensitive.sh --branch

  scan-main:
    name: scan main on push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan main vs its previous head
        env:
          BASE_BRANCH: ${{ github.event.before }}
        # Use origin/main as the base for the diff. The
        # event.before is the previous head; fall back to
        # HEAD~1 if the previous head is unreachable
        # (force-push).
        run: |
          if git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
            bash tools/scripts/check-sensitive.sh --branch
          else
            echo "::warning::BASE_BRANCH=$BASE_BRANCH unreachable (force-push?), running --tree"
            bash tools/scripts/check-sensitive.sh --tree || true
          fi

  scan-weekly:
    name: full-tree scan (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full-tree scan
        # Always exit 0 (continue-on-error + || true) so the
        # weekly run never blocks; leaks surface as a
        # visible failure for triage.
        run: |
          bash tools/scripts/check-sensitive.sh --tree || {
            echo "::warning::Historical leaks in main (see workflow logs)."
            echo "Triage: edit the offending files, open a cleanup PR."
            exit 0
          }
