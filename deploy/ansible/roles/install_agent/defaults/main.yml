---
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Defaults for the install_agent role. Variables
# that are usually site-specific live in
# `group_vars/all.yml`; the ones here are per-host
# defaults the operator can override per-node
# (`-e aegis_panel_url=https://panel.example.com`).

# aegis_panel_url is the URL the agent uses to
# reach the panel (for Apply commands in v0.4.0
# — v0.3.0 does not need it).
aegis_panel_url: "http://127.0.0.1:8080"

# aegis_node_name is the human-friendly node
# identifier; the agent logs it on every Apply.
aegis_node_name: "{{ inventory_hostname }}"

# aegis_agent_listen_addr is the bind address
# the agent listens on. 127.0.0.1 keeps the
# surface local (Caddy/SSH are the only ingress
# paths). Operators that want a different bind
# (e.g. inside a Docker compose network) can
# override here.
aegis_agent_listen_addr: "127.0.0.1:8080"

# aegis_agent_log_level is one of `trace` /
# `debug` / `info` / `warn` / `error`. The agent
# writes to stdout; systemd captures it to the
# journal.
aegis_agent_log_level: "info"

# aegis_agent_user is the Linux user the agent
# runs as. The systemd unit restricts file mode
# to this user; root is the default because the
# agent writes to `/etc/aegis/agent.env` (only
# root can write there on a stock install).
aegis_agent_user: "root"

# aegis_singbox_config_path is the absolute path
# the agent writes the rendered sing-box config
# to on every Apply. v0.4.0-b makes this side
# effect real (v0.3.0 just ACKed). The default
# matches the sing-box systemd unit installed by
# the install_singbox role (v0.4.0-c), which
# reads `-c <this-path>`. Operators on a non-
# Debian layout (e.g. Arch, custom sing-box
# build) can override.
aegis_singbox_config_path: "/etc/sing-box/config.json"

# aegis_singbox_reload_cmd is the shell-free
# command the agent runs after writing the
# config. The default is the systemd reload for
# the standard sing-box unit. Operators with a
# different init system (s6, runit, supervisord,
# docker exec) override here. The command is
# space-separated; no shell metacharacters. If
# you need a pipe, wrap it in a script and call
# the script.
aegis_singbox_reload_cmd: "systemctl reload sing-box"

# aegis_singbox_reload_timeout is the budget for
# the reload subprocess. systemd `Type=notify`
# reloads complete in well under a second; 5s
# is a 5x safety margin. The agent's HTTP
# `WriteTimeout` (30s) is the hard upper bound.
aegis_singbox_reload_timeout: "5s"

# aegis_apply_max_bytes is the cap on the
# /v1/apply request body. The default 1 MiB
# is a 10x safety margin over a typical
# 100 KiB rendered sing-box config. Operators
# can lower it for tighter DoS protection or
# raise it for unusual configs (large
# `rule_set` lists).
aegis_apply_max_bytes: "1048576"
