    Inbound:
      type: object
      required: [id, nodeId, name, protocol, listen, listenPort, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        nodeId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        protocol:
          $ref: '#/components/schemas/Protocol'
        listen:
          type: string
          example: '::'
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
        listenPorts:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
        enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        params:
          type: object
          additionalProperties: true
          description: |
            Protocol-specific configuration. The shape is owned
            by the sing-box provider; v0.2.0 surfaces a generic
            JSON editor for it.
        templateId:
          type: string
          format: uuid
          nullable: true
          description: |
            v0.8.13+: optional FK to an
            `inbound_templates` row. When non-null,
            the sing-box renderer reads
            `template.params` instead of `inbound.params`.
            The CRUD layer (PR #211) enforces
            template existence and protocol match;
            a protocol mismatch returns 400 with
            `field=templateId`. Pre-v0.8.13 inbounds
            have `templateId = null` (the v0.8.0-v0.8.12
            default, every inbound uses its inline
            `params`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InboundCreateRequest:
      type: object
      required: [name, protocol, listenPort]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        protocol:
          $ref: '#/components/schemas/Protocol'
        listen:
          type: string
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
        listenPorts:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
        enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        params:
          type: object
          additionalProperties: true
        templateId:
          type: string
          format: uuid
          nullable: true
          description: |
            v0.8.13+: optional FK to an
            `inbound_templates` row. See
            `Inbound.templateId` for the full
            semantics. Omit (or send `null`) for
            the v0.8.0-v0.8.12 default.

    InboundUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        protocol:
          $ref: '#/components/schemas/Protocol'
        listen:
          type: string
        listenPort:
          type: integer
          minimum: 1
          maximum: 65535
        listenPorts:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 65535
        enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        params:
          type: object
          additionalProperties: true
        templateId:
          type: string
          format: uuid
          nullable: true
          description: |
            v0.8.13+: optional FK to an
            `inbound_templates` row. Send `null`
            to clear the template reference on
            the inbound. Send a new UUID to
            reassign. Omit (do not include the
            key at all) to leave the current
            template reference unchanged.
            Protocol-match validation runs
            against the inbound's effective
            protocol (the patch's `protocol`
            field, if also set, otherwise the
            existing one). See PR #211.

