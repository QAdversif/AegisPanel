    PlanResetPeriod:
      type: string
      description: |
        The cadence at which a user's `trafficUsedBytes`
        counter resets to zero. The closed set is pinned
        by the `plans.reset_period` CHECK in migration
        0001. The Service layer is the authoritative gate.
      enum: [daily, weekly, monthly, never]

    Plan:
      type: object
      required: [id, name, trafficLimitBytes, durationNs, deviceLimit, resetPeriod, priceCents, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        trafficLimitBytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Per-user traffic cap applied to any user on
            this plan. 0 = unlimited.
        durationNs:
          type: integer
          format: int64
          minimum: 60000000000
          description: |
            Validity period of a subscription issued on
            this plan, in nanoseconds. The Service
            enforces [1 minute, 10 years] =
            [60_000_000_000, 315_360_000_000_000] ns.
        deviceLimit:
          type: integer
          minimum: 0
          maximum: 64
          description: |
            Max concurrent VPN connections per user.
            0 = unlimited.
        resetPeriod:
          $ref: '#/components/schemas/PlanResetPeriod'
        priceCents:
          type: integer
          format: int64
          minimum: 0
          description: |
            List price in cents. The panel does not
            model FX; the operator sets the currency
            via the cabinet UI's locale. 0 = free.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

