        rotatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PanelPathRotateRequest:
      type: object
      properties:
        graceWindowSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: |
