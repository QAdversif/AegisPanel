openapi: 3.0.3
info:
  title: Aegis Panel API
  version: 0.8.6
  description: |
    Aegis — self-hosted VPN control panel. Multi-core (sing-box / Xray /
    Hysteria 2), BYO Node, Cascade Topology, MCP-driven, decoy sites,
    port masquerading.

    v0.7.0 surface (this document):
      - /auth/*  (login, refresh, me, change-password)
      - /nodes/*  (CRUD — admin)
      - /nodes/{nodeId}/inbounds/*  (CRUD — admin)
      - /hosts/*  (CRUD — admin)
      - /plans/*  (CRUD — admin; v0.6.0)
      - /users/*  (CRUD + rotate-token — admin)
      - /panelcfg/*  (sub_path rotation — admin)
      - /sub/{token}  (public subscription render — anonymous)
      - /audits/*  (audit log read — admin)
      - /backups/*  (CRUD + restore — admin; v0.5.0)
      - /webhooks/*  (CRUD + deliveries + DLQ + test — admin; v0.7.0)
      - /health  (liveness — anonymous)
      - /cores  (provider catalog — admin)

    Out of scope for this spec (added in subsequent v0.2.x PRs):
      - /admin/*  (admin principal CRUD — PR-J)
      - /cabinet/*  (end-user cabinet)

  license:
    name: AGPL-3.0-or-later
  contact:
    name: Aegis Panel
    url: https://github.com/QAdversif/AegisPanel

servers:
  - url: https://panel.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [meta]
      summary: Liveness probe
      description: |
        Returns the panel's health status. Anonymous (no Bearer
        required); used by the load balancer and the CI smoke test.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate
      description: |
        Exchange username + password for an access token and a refresh
        token. Wrong credentials always return 401 — the error never
        distinguishes "unknown user" from "wrong password" so
        attackers cannot enumerate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed body or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh
      description: |
        Trade a refresh token for a fresh access+refresh pair. The
        presented token is consumed (single-use). Reuse of a
        consumed token is detected and triggers chain revocation:
        every outstanding refresh for the user is invalidated,
        the response is 401, and a `WARN` log line is emitted. This
        is the most likely signal of token theft.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Invalid or already-used refresh token; chain may have
            been revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags: [auth]
      summary: Who am I
      description: |
        Return the identity of the principal behind the bearer
        access token.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cores:
    get:
      tags: [meta]
      summary: Core provider catalog
      description: |
        Returns the list of registered sing-box / Xray / Hysteria 2
        provider names plus the in-development (noop) dev provider
        when the panel is in `AEGIS_ENV != production`. The UI uses
        this to render the "core provider" badge on the Nodes page.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes:
    get:
      tags: [nodes]
      summary: List nodes
      description: |
        Every VPN node registered with the panel. The list is sorted
        by `name` ascending. v0.1.0 does not paginate — the panel
        scale is "tens of nodes" so the full list is fine.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [nodes]
      summary: Register a node
      description: |
        Register a new VPN node with the panel. The agent
        registration handshake is a separate step that lands with
        the BYO Node flow in v0.3 (per the v9 §3.3 roadmap); for now
        the panel stores the node metadata and the operator SSHes
        into the node by hand to install the agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Name or address already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [nodes]
      summary: Get a node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [nodes]
      summary: Update a node
      description: |
        Partial update (the same PUT semantics the rest of the
        v0.2.0 CRUD surfaces use). Absent keys mean "leave alone".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [nodes]
      summary: Delete a node
      responses:
        '204':
          description: No content
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes/{id}/provision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [nodes]
      summary: Provision a node (v0.3.0 BYO Node flow)
      description: |
        Runs the bootstrap workflow: SSH probe with
        the supplied key, install the placeholder agent
        systemd unit, and transition the node to either
        `online` (success) or `offline` (failure). Only
        nodes in a provisionable state (`new` or
        `offline`) accept the call; a node already
        `online` returns 409.

        v0.3.0 ships the synchronous `Provision` method.
        v0.5.0 adds a kick-off+poll mode for large
        fleets (returns 202 Accepted with a job id).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeProvisionRequest'
      responses:
        '200':
          description: Provision completed (state is now online or offline)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeProvisionResponse'
        '400':
          description: Validation error (missing ssh_private_key, unknown tofu_policy, malformed body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Node is not in a provisionable state (e.g. already online)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Provision failed (SSH unreachable, install error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes/{id}/rotate-panel-key:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [nodes]
      summary: Rotate the panel's persistent SSH key on a node
      description: |
        Generate a fresh ed25519 keypair on the panel,
        encrypt the private half with the operator's
        age envelope, persist the ciphertext on the
        `nodes.ssh_private_key_ciphertext` column,
        and append the public half to the node's
        `~/.ssh/authorized_keys`. After the call
        returns, the next re-provision on the node
        (via `POST /api/v1/nodes/{id}/provision`
        with the `authMethod: 'stored'` path)
        decrypts and reuses the new key — the
        v0.8.x "auto-deploy" experience becomes
        available retroactively on v0.3.0..v0.7.x
        nodes.

        The HTTP endpoint is the v0.8.4 UI mirror
        of the v0.8.3 `aegis admin node
        rotate-panel-key` CLI (PR #184); both call
        the same `bootstrap.Service.RotatePanelKey`
        method.

        The operator's existing private key must
        already be in the node's
        `~/.ssh/authorized_keys` (i.e. this is the
        key they used to install the node on
        v0.3.0..v0.7.x). A password would only be
        meaningful on a brand-new node that does
        not yet have any keys — that path is the
        `/nodes/{id}/provision` endpoint, not
        this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRotatePanelKeyRequest'
      responses:
        '200':
          description: Rotation succeeded. The 200 body carries the new public key line and SHA256 fingerprint so the operator can verify what is now in the node's authorized_keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRotatePanelKeyResponse'
        '400':
          description: Validation error (missing ssh_private_key, malformed body, invalid UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Panel was booted without an envelope (AEGIS_WEBHOOKS_SECRET_AGE_*). Operator must fix the panel's env and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: SSH-side failure (Connect / Upload / Run / SetSSHPrivateKeyCiphertext)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes/{id}/stored-key:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [nodes]
      summary: Read the node's stored panel SSH key surface
      description: |
        v0.8.5: the read-side mirror of the
        v0.8.1 persistent panel SSH key
        feature. The endpoint decrypts
        `nodes.ssh_private_key_ciphertext`
        via the operator's age envelope,
        derives the public-key line +
        SHA-256 fingerprint, and returns the
        public surface. The private key
        never leaves the panel process.

        The response is always 200 (not
        404) — the `has_stored_key` boolean
        distinguishes the "row has a
        stored key" (true) from the "row
        exists but no key yet" (false)
        case. `new` nodes that have never
        been installed via the v0.8.1+
        path return `has_stored_key:
        false`; the UI surfaces a "no
        stored key yet" hint in that case.

        Every call records a
        `node.stored-key.read` audit row
        with the operator's id from the
        JWT claims + the node id. The
        fingerprint is in the response
        body (not the audit row) so the
        operator can correlate the audit
        row with the read they performed.
      responses:
        '200':
          description: Stored key surface (or "no key yet" if has_stored_key is false).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeStoredKey'
        '400':
          description: Validation error (malformed UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Panel was booted without an envelope (AEGIS_WEBHOOKS_SECRET_AGE_*). Operator must fix the panel's env and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Stored ciphertext is unreadable (decrypt failed — the age identity has been rotated out of the operator's reach, or the column was written with a different envelope version)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes/{id}/refresh-agent-bearer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [nodes]
      summary: Refresh the agent bearer from the node
      description: |
        v0.8.7: operator-side recovery path for
        the agent bearer. The flow:

        1. The panel reads the node's stored
           panel SSH key (the v0.8.1
           persistent key, decrypted via the
           operator's age envelope).
        2. Opens an SSH session to the node
           using the stored key + the
           panel's `known_hosts` file
           (TofuPolicy=Reject; the host must
           already be trusted from a prior
           v0.3.0 / v0.8.4 install).
        3. Runs `cat /etc/aegis/agent.env`
           and parses the
           `AEGIS_AGENT_BEARER=...` line.
        4. Persists the new bearer to
           `nodes.agent_bearer`.
        5. Records a `node.agent-bearer.refresh`
           audit row with the operator's id +
           the node id + the SSH key
           fingerprint (the bearer itself is
           NOT in the audit row — same
           shape as the v0.8.5
           `node.stored-key.read`).

        The recovery fixes the "agent
        regenerated its bearer out-of-band"
        case: operator restarted the agent,
        wiped `/etc/aegis/agent.env`, rotated
        secrets manually, etc. The next
        `BatchedApplier` apply call uses the
        refreshed bearer; the v0.8.x follow-up
        PRs wire this into a 401 → auto-refresh
        recovery loop (the v0.8.7 PR is the
        Service + HTTP + UI surface; the
        BatchedApplier integration is a
        separate work unit).

        # Body
        Optional. The `ssh_port` and
        `ssh_user` fields are per-call
        overrides; the service-level defaults
        (and the node's stored `Address`) fill
        in any omitted field.

        # Errors
          - `400` malformed UUID or body
          - `404` node not found
          - `409` no stored key (the operator
            must `rotate-panel-key` first)
          - `500` panel wiring missing (SSH
            factory, known_hosts path, or age
            envelope not configured)
          - `502` SSH connect / run / agent.env
            parse failure
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeRefreshAgentBearerRequest'
      responses:
        '200':
          description: Agent bearer refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeRefreshAgentBearerResponse'
        '400':
          description: Validation error (malformed UUID or malformed body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No stored panel SSH key (rotate-panel-key first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Panel wiring missing (SSH client factory, known_hosts path, or age envelope not configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: SSH connect / run / agent.env parse failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes/{nodeId}/inbounds:
    parameters:
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [inbounds]
      summary: List inbounds for a node
      description: |
        Every inbound registered on the given node. The list is
        sorted by `name` ascending. v0.1.0 does not paginate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [inbounds]
      summary: Register an inbound
      description: |
        Create a new protocol listener on the given node. The
        `params` field is a free-form JSON blob whose schema is
        owned by the sing-box provider; v0.2.0 surfaces a generic
        JSON editor for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbound'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Name or port already in use on this node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /nodes/{nodeId}/inbounds/{id}:
    parameters:
      - name: nodeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [inbounds]
      summary: Get an inbound
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbound'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [inbounds]
      summary: Update an inbound
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbound'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [inbounds]
      summary: Delete an inbound
      responses:
        '204':
          description: No content
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts:
    get:
      tags: [hosts]
      summary: List hosts
      description: |
        Every host (bundle of endpoints) registered with the panel.
        v0.1.0 does not paginate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [hosts]
      summary: Create a host
      description: |
        Create a new host. The `endpoints` array is required
        (cross-field validation: 1 endpoint for `type=direct`,
        2+ endpoints plus a balancer strategy for `type=balancer`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '400':
          description: Validation error (including cross-field)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hosts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [hosts]
      summary: Get a host
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [hosts]
