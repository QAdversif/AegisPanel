    PanelPathRotateToRequest:
      type: object
      required: [subPath]
      properties:
        subPath:
          type: string
          minLength: 4
          maxLength: 64
          pattern: '^[a-z0-9-]+$'
          description: |
            The new sub_path. Must match [a-z0-9-]{4,64}.
        graceWindowSeconds:
          type: integer
          minimum: 0
          maximum: 3600

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: The operator's CURRENT password. Verified to defend against a stolen access token.
        new_password:
          type: string
          minLength: 8
          description: The NEW password. Must differ from the current one and be at least 8 chars.

    AuditEntry:
      type: object
      required: [id, action, resourceType, createdAt]
      properties:
        id:
          type: string
          description: |
            The bigserial id rendered as a string for stable
            cross-language parsing.
        actorId:
          type: string
          format: uuid
          description: The admin UUID that triggered the action. Empty for system-driven entries.
        actorUsername:
          type: string
          description: |
            Denormalised from `admins.username` at write time
            so the read path does not need to join.
        action:
          type: string
          description: |
            The action verb (e.g. `user.create`,
            `user.update`, `host.rotate_token`). Closed set
            in v0.3; free-form in v0.2.
        resourceType:
          type: string
          description: |
            The noun side of the action (`user`, `host`,
            `inbound`, `node`, `panelcfg`).
        resourceId:
          type: string
          description: The target's primary key. Empty for collection-level actions.
        before:
          description: |
            The pre-mutation state as a JSONB blob. Returned
            in full only on the `/{id}` path; the list path
            elides it (`null` on the wire).
        after:
          description: |
            The post-mutation state. Same caveats as
            `before`.
        ip:
          type: string
          description: The client IP, copied from `r.RemoteAddr` (after RealIP middleware).
        userAgent:
          type: string
          description: The raw User-Agent header. Capped at 512 chars on the pgx-INSERT path.
        createdAt:
          type: string
          format: date-time
          description: Wall-clock time the entry was minted (UTC).

    AuditListResponse:
      type: object
      required: [audits]
      properties:
        audits:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
          description: |
            The list of entries matching the filter. The
            list path elides `before` / `after`; the
            `/{id}` path returns them in full.

    WebhookEventType:
      type: string
      enum:
        - user.created
        - user.updated
        - user.deleted
        - plan.created
        - plan.updated
        - plan.deleted
        - node.created
        - node.updated
        - node.deleted
        - host.created
        - host.updated
        - host.deleted
        - backup.created
        - backup.completed
        - backup.failed
        - inbound.created
        - inbound.updated
        - inbound.deleted
      description: |
        The closed set of event types the dispatcher can
        fan out. Adding a new event type is a v0.8+ follow-up
        (the `webhooks.EventType` enum is the only place that
        has to be updated; the receiver-side signature
        verification is unchanged). v0.7.1 wires the dispatcher
        into every mutating handler so this closed set is
        actually fanned out to operators' receivers.

    WebhookDeliveryStatus:
      type: string
      enum: [success, retry, failed]
      description: |
        Per-attempt outcome. `success` is a 2xx response,
        `retry` is a non-2xx or transport error that will be
        retried (the operator can manually trigger the next
        attempt via the Service's RetryDelivery hook),
        `failed` is the final attempt that exhausted the
        retry budget (1s, 5s, 25s, 2m15s, 11m15s — 6 attempts
        total). Failed deliveries are moved to the DLQ.

    WebhookEndpoint:
      type: object
      required: [id, url, secret, events, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          minLength: 10
          maxLength: 2048
        secret:
          type: string
          minLength: 16
          maxLength: 256
          description: |
            HMAC-SHA256 secret. Shown VERBATIM on the POST
            / response (one-time), redacted to `***` on every
            subsequent read. v0.7.1 stores the column under
            an sops+age envelope (filippo.io/age X25519+ChaCha20-
            Poly1305, multi-recipient for key rotation) on
            disk; the wire-level redaction contract is
            unchanged.
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          description: |
            The event subscription. Empty array = "all events"
            (the wildcard). A non-empty list narrows the
            subscription to the named event types.
        enabled:
          type: boolean
          description: |
            Disabled endpoints are skipped by the dispatcher
            (the result for a Dispatch call shows the
            endpoint in the per-call report with an empty
            Status).
        lastDeliveryAt:
          type: string
          format: date-time
          nullable: true
        lastStatusCode:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookEndpointCreateRequest:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
          format: uri
          minLength: 10
          maxLength: 2048
        secret:
          type: string
          minLength: 16
          maxLength: 256
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
          default: []
        enabled:
          type: boolean
          default: true

    WebhookEndpointUpdateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 10
          maxLength: 2048
        secret:
          type: string
          minLength: 16
          maxLength: 256
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        enabled:
          type: boolean

    WebhookEndpointListResponse:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'

    Credential:
      type: object
      required: [id, user_id, inbound_id, credential_value, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        inbound_id:
          type: string
          format: uuid
        credential_value:
          type: string
          minLength: 1
          description: |
            Opaque per-protocol credential. The panel
            stores it as TEXT; the sing-box renderer
            is authoritative for per-protocol shape
            validation (UUID format for VLESS, password
            length for HY2 / Trojan, etc.). Operators
            with `credentials:read` scope can read
            this field back via GET /credentials/{id}
            and GET /credentials/by-user/{userId}.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CredentialCreateRequest:
      type: object
      required: [user_id, inbound_id, credential_value]
      properties:
        user_id:
          type: string
          format: uuid
        inbound_id:
          type: string
          format: uuid
        credential_value:
          type: string
          minLength: 1

    CredentialRotateRequest:
      type: object
      required: [credential_value]
      properties:
        credential_value:
          type: string
          minLength: 1

    CredentialListResponse:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/Credential'

    WebhookDelivery:
      type: object
      required: [id, endpointId, eventType, requestUrl, requestBody, signature, timestamp, attempt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        payload:
          description: |
            The event payload as canonical JSON. JSONB on
            the wire — the canonical form (no whitespace,
            keys sorted alphabetically) is generated by
            the dispatcher before the request is signed
            and sent.
          type: object
          additionalProperties: true
        requestUrl:
          type: string
          format: uri
          description: |
            Snapshot of the endpoint URL at dispatch time
            (the operator can edit the endpoint URL after a
            delivery without rewriting the history).
        requestBody:
          type: string
          format: byte
          description: |
            The exact bytes the panel sent (the canonical
            JSON body). Stored as BYTEA so a manual replay
            sends the identical body the receiver saw on the
            original attempt.
        signature:
          type: string
          description: |
            The `X-Aegis-Signature` header value, in the
            canonical `sha256=<hex>` form. Receiver-side
            recompute + constant-time compare is the
            verification contract.
        timestamp:
          type: string
          format: date-time
          description: |
            Wall-clock time the request was made (the
            `X-Aegis-Timestamp` header value, RFC 3339 nano).
        statusCode:
          type: integer
          nullable: true
        responseBody:
          type: string
          nullable: true
          description: |
            Capped at 4 KiB. Empty for transport errors.
        error:
          type: string
          nullable: true
          description: |
            Transport error message (DNS failure, TCP RST,
            TLS handshake error, etc). Empty for HTTP
            responses.
        attempt:
          type: integer
          minimum: 1
          maximum: 6
          description: |
            1-indexed attempt number. 6 = the final attempt
            (the next failure would move the delivery to the
            DLQ).
        durationMs:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time

    WebhookDeliveryListResponse:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'

    WebhookDLQEntry:
      type: object
      required: [id, endpointId, endpointUrl, eventType, lastError, attempts, lastAttemptAt, enqueuedAt]
      properties:
        id:
          type: string
          format: uuid
        endpointId:
          type: string
          format: uuid
          description: |
            Logical reference to the endpoint. Not a
            physical FK — the endpoint may be deleted without
            affecting the DLQ row.
        endpointUrl:
          type: string
          format: uri
          description: |
            Snapshot of the URL at enqueue time. Used as
            the fallback for the replay endpoint when the
            endpoint row no longer exists.
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        payload:
          type: object
          additionalProperties: true
        lastError:
          type: string
        attempts:
          type: integer
        lastAttemptAt:
          type: string
          format: date-time
        enqueuedAt:
          type: string
          format: date-time

    WebhookDLQListResponse:
      type: object
      required: [dlq]
      properties:
        dlq:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDLQEntry'

    WebhookDispatchResult:
      type: object
      required: [endpointId, status, attempts]
      properties:
        endpointId:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        statusCode:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
        attempts:
          type: integer

    InboundTemplate:
      type: object
      required: [id, name, protocol, params, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        protocol:
          $ref: '#/components/schemas/Protocol'
        params:
          type: object
          additionalProperties: true
          description: |
            Protocol-specific configuration. The shape
            is owned by the sing-box provider; v0.8.13
            surfaces a generic JSON editor for it.
            When an inbound's `templateId` resolves to
            this template, the sing-box renderer reads
            these `params` instead of the inbound's
            inline `params`.
        description:
          type: string
          nullable: true
          maxLength: 256
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InboundTemplateCreateRequest:
      type: object
      required: [name, protocol, params]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        protocol:
          $ref: '#/components/schemas/Protocol'
        params:
          type: object
          additionalProperties: true
          default: {}
        description:
          type: string
          maxLength: 256

    InboundTemplateUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        protocol:
          $ref: '#/components/schemas/Protocol'
        params:
          type: object
          additionalProperties: true
        description:
          type: string
          maxLength: 256

    InboundTemplateListResponse:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/InboundTemplate'

