          format: int64
          minimum: 0
          default: 0
        durationNs:
          type: integer
          format: int64
          minimum: 60000000000
        deviceLimit:
          type: integer
          minimum: 0
          maximum: 64
          default: 0
        resetPeriod:
          $ref: '#/components/schemas/PlanResetPeriod'
        priceCents:
          type: integer
          format: int64
          minimum: 0
          default: 0

