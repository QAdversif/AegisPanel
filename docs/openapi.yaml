                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plans:
    get:
      tags: [plans]
      summary: List plans
      description: |
        Every plan (tariff) the operator has configured.
        v0.6.0 does not paginate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [plans]
      summary: Create a plan
      description: |
        Create a new plan. The server generates the id
        and timestamps; the caller supplies the
        operator-visible fields (name, traffic limit,
        duration, device limit, reset period, price).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Plan name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [plans]
      summary: Get a plan
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [plans]
      summary: Update a plan
      description: |
        Partial update (the same PATCH semantics the v0.2 CRUD
        surfaces use). All fields are optional; the absence
        of a key means "leave unchanged". The `duration_ns`
        field is in nanoseconds — the front-end converts a
        human-readable "30 days" string to ns before sending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [plans]
      summary: Delete a plan
      description: |
        Hard delete. The `users.plan_id` column has no FK
        constraint (migration 0001), so deleting a plan
        that still has users pointing at it leaves those
        users with a dangling plan_id; the subscription
        package's ListPoolsForUser handles dangling plan
        IDs by returning an empty pool list, so the user
        silently loses access to the plan's pools.
        The UI shows a confirm dialog that lists the
        affected user count before DELETE.
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /inbound-templates:
    get:
      tags: [inbound-templates]
      summary: List inbound templates
      description: |
        Every template (named, reusable protocol
        configuration) the operator has configured.
        Templates are global, not per-node: any
        inbound on any node can reference one via
        the `templateId` FK. v0.8.13 does not
        paginate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundTemplateListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [inbound-templates]
      summary: Create an inbound template
      description: |
        Create a new named, reusable protocol
        configuration. The server generates the
        id and timestamps; the caller supplies
        the operator-visible fields (name,
        protocol, params, description). The
        protocol must be one of vless, hysteria2,
        shadowsocks, trojan; the `params` field
        is a free-form JSON blob whose shape is
        owned by the sing-box provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundTemplateCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundTemplate'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Template name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /inbound-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [inbound-templates]
      summary: Get an inbound template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundTemplate'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [inbound-templates]
      summary: Update an inbound template
      description: |
        Partial update (the same PATCH semantics the
        v0.2 CRUD surfaces use). All fields are
        optional; the absence of a key means "leave
        unchanged".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundTemplateUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboundTemplate'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [inbound-templates]
      summary: Delete an inbound template
      description: |
        Hard delete. The `inbounds.template_id`
        column has an `ON DELETE SET NULL` FK
        (migration 0021), so deleting a template
        that still has inbounds pointing at it
        drops the FK to NULL on those inbounds;
        the sing-box renderer falls back to
        each inbound's inline `params` (the
        v0.8.0-v0.8.12 default). No data loss
        for the affected inbounds; the operator
        just loses the shared-params link.
        The UI shows a confirm dialog that
        lists the affected inbound count before
        DELETE.
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks:
    get:
      tags: [webhooks]
      summary: List webhook endpoints
      description: |
        Every operator-configured outgoing-webhook target.
        v0.7.0 does not paginate. The `secret` field is
        redacted to `***` on every read EXCEPT the immediate
        POST / response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [webhooks]
      summary: Create a webhook endpoint
      description: |
        Create a new outgoing-webhook target. The server
        generates the id and timestamps; the caller supplies
        the operator-visible fields (URL, HMAC secret, event
        subscription, enabled flag). The response includes
        the secret VERBATIM — the operator copies it to
        their receiver's HMAC config. Subsequent GETs redact
        the secret to `***`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Endpoint URL already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/dlq:
    get:
      tags: [webhooks]
      summary: List DLQ entries
      description: |
        Every dead-letter entry across all endpoints. The DLQ
        holds deliveries that exhausted the retry budget
        (1s, 5s, 25s, 2m15s, 11m15s — 6 attempts total).
        Replay via POST /webhooks/dlq/{did}/replay.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDLQListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/dlq/{did}:
    parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [webhooks]
      summary: Get a DLQ entry
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDLQEntry'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [webhooks]
      summary: Drop a DLQ entry
      description: |
        Mark the entry as resolved / dropped. Does not
        affect the underlying endpoint or the live delivery
        state.
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/dlq/{did}/replay:
    parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [webhooks]
      summary: Replay a DLQ entry
      description: |
        Take the DLQ entry off the queue and dispatch a
        fresh attempt. The new delivery is signed and
        timestamped at replay time (the receiver sees a
        "current" `X-Aegis-Timestamp`). The DLQ entry is
        NOT automatically deleted; the operator decides
        when to clear it (typically after the receiver has
        acknowledged the replay).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDispatchResult'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: |
            Returned when the original endpoint was deleted
            and the operator did not recreate it (the secret
            is not stored on the DLQ row).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [webhooks]
      summary: Get a webhook endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [webhooks]
      summary: Update a webhook endpoint
      description: |
        Partial update (the same PATCH semantics the v0.2 CRUD
        surfaces use). All fields are optional; the absence
        of a key means "leave unchanged".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [webhooks]
      summary: Delete a webhook endpoint
      description: |
        Hard delete. ON DELETE CASCADE removes the delivery
        history. DLQ rows are kept (the FK is logical, not
        physical) — see the DLQEntry doc comment in
        `internal/webhooks`.
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/{id}/deliveries:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 1000
    get:
      tags: [webhooks]
      summary: List delivery history for an endpoint
      description: |
        Every POST attempt the dispatcher made to this
        endpoint, sorted by CreatedAt desc. Each row
        carries the HTTP response code, the response body
        snapshot (capped at 4 KiB), the signature, and the
        duration in milliseconds.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryListResponse'
        '404':
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [webhooks]
      summary: Send a synthetic test event
      description: |
        Dispatch a synthetic `webhook.test` event to the
        endpoint. The operator uses this to verify their
        receiver setup end-to-end without having to trigger
        a real panel event.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDispatchResult'
        '404':
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credentials:
    get:
      tags: [credentials]
      summary: List credentials
      description: |
        Every per-(user, inbound) credential the
        operator has configured. v0.8.2 does not
        paginate; the table is small in practice
        (one row per user per inbound). For a
        cross-user admin table the canonical caller
        is the CredentialsView; the per-user /
        per-inbound routes below are the more
        selective access paths the future multi-user
        sing-box renderer will use internally.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [credentials]
      summary: Create a credential
      description: |
        Create a new per-(user, inbound) credential.
        The server generates the id and timestamps;
        the caller supplies the (user_id, inbound_id)
        pair and the credential_value. The
        credential_value is an operator secret
        (VLESS UUID, Shadowsocks 2022-blake3
        password, etc.); the panel stores it as TEXT
        and the sing-box renderer is authoritative
        for per-protocol shape validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A credential already exists for this (user, inbound) pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credentials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [credentials]
      summary: Get a credential
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [credentials]
      summary: Rotate a credential
      description: |
        Update the credential_value of an existing
        row. The (user_id, inbound_id) pair is fixed
        by the existing row; PATCH only takes the new
        credential_value. Re-stamps updated_at.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRotateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [credentials]
      summary: Delete a credential
      description: |
        Hard delete. The (user_id, inbound_id) UNIQUE
        constraint means the next Create on the same
        pair will succeed; the panel does not
        soft-delete credentials.
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credentials/by-user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [credentials]
      summary: List credentials for a user
      description: |
        Every credential for the given user. The
        "View credentials" action in the UsersView
        dropdown hits this route.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '400':
          description: Invalid userId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /credentials/by-inbound/{ibId}:
    parameters:
      - name: ibId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [credentials]
      summary: List credentials for an inbound
      description: |
        Every credential for the given inbound. The
        "Who can use this inbound?" panel on an
        inbound row hits this route.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '400':
          description: Invalid ibId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      tags: [users]
      summary: List users
      description: |
        Every end-user VPN account registered with the panel.
        v0.1.0 does not paginate.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [users]
      summary: Create a user
      description: |
        Create a new end-user account. The server generates a
        fresh `sub_token` (32 hex chars) and returns it in the
        response — the operator hands the token to the user out-
        of-band (e.g. via the admin UI's "show once" dialog).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [users]
      summary: Get a user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [users]
      summary: Update a user
      description: |
        Partial update (the same PATCH semantics the v0.2 CRUD
        surfaces use). Use the `sub_token` PATCH to rotate the
        sub_token; use the `status: deleted` PATCH to soft-delete
        the user. The dedicated `POST /users/{id}/rotate-token`
        endpoint is a convenience for the rotation case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}/rotate-token:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [users]
      summary: Rotate the user's sub_token
      description: |
        Generate a fresh sub_token. The previous token stops
        working immediately (no grace window) — the operator
        hands the new token to the user out-of-band and the user
        re-imports the URL on every device.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /panelcfg:
    get:
      tags: [panelcfg]
      summary: Get the active sub_path
      description: |
        Returns the current URL prefix for the subscription
        endpoint. An empty string means the documented
        `/api/v1/sub/{token}` path is in use (the default).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelPathConfig'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /panelcfg/rotate:
    post:
      tags: [panelcfg]
      summary: Rotate to a fresh random sub_path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelPathConfig'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PanelPathRotateRequest'

  /panelcfg/rotate-to:
    post:
      tags: [panelcfg]
      summary: Rotate to an explicit sub_path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanelPathRotateToRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelPathConfig'
        '400':
          description: Invalid path (length or charset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /panelcfg/reset:
    post:
      tags: [panelcfg]
      summary: Reset to the default empty sub_path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelPathConfig'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sub/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [subscription]
      summary: Render a subscription
      description: |
        The public subscription render endpoint. The
        `{token}` is the user's `sub_token` (the credential).
        The `?target=` query parameter selects the wire
        format (`base64` default, `singbox`, `clash`, `html`).
        The endpoint is rate-limited per sub_token (1 rps
        sustained, 5 burst by default); an over-budget
        request returns 429 with a `Retry-After` header.
      security: []
      parameters:
        - name: target
          in: query
          required: false
          schema:
            type: string
            enum: [base64, singbox, clash, html]
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: 'vless://uuid@node1.example.com:443?type=tcp&security=none#node1'
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                outbounds:
                  - type: vless
                    server: node1.example.com
                    port: 443
            text/yaml:
              schema:
                type: string
              example: |
                proxies:
                  - name: "node1"
                    type: vless
                    server: node1.example.com
                    port: 443
            text/html:
              schema:
                type: string
              example: |
                <!doctype html>
                <html><body><h1>AegisPanel subscription</h1></body></html>
        '400':
          description: Missing sub_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: User is not in a live state (disabled / expired / deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown sub_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported ?target= value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: |
            Rate limit exceeded. The `Retry-After` header
            contains the wall-clock seconds to wait before
            retrying.
          headers:
            Retry-After:
              schema:
                type: integer
                description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me/password:
    post:
      tags: [auth]
      summary: Change my password
      description: |
        Rotate the calling operator's argon2id password. The current
        password is verified to defend against a stolen bearer token
        being used to lock the operator out of their own account —
        the security model is "an attacker with a stolen token must
        also know the password before they can change it".

        On success, the existing refresh tokens are KEPT (the user
        is not logged out); the operator's other browsers and
        devices stay authenticated. A future PR adds an
        "invalidate all sessions" toggle for the
        "I think I lost my laptop" path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: |
            Malformed body, missing fields, or new password too
            short (< 8 chars) or unchanged from the current one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |
            Missing/invalid bearer token, or the current password
            is wrong (collapsed to the same code as the
            "no such user" 401 to avoid leaking which is which).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /audits:
    get:
      tags: [audits]
      summary: List audit log entries
      description: |
        Returns the most recent audit entries, ordered by
        `createdAt` DESC. The default cap is 100; the maximum
        is 1000 (the server clamps above that). The list path
        elides the `before` / `after` JSONB blobs to keep the
        response compact; the `/{id}` path returns them in full.

        Every entry is the v0.2.0 wire shape: `actorId`,
        `actorUsername`, `action`, `resourceType`,
        `resourceId`, `ip`, `userAgent`, `createdAt`. The
        `actorUsername` is denormalised from `admins.username`
        at write time so the read path does not need to join.

        The v0.2.0 read API is the entire surface — the write
        path (the in-handler `audits.Record(...)` call) is
        internal. v0.3+ adds the mutating-handler call-sites
        for the nodes / hosts / inbounds / users / panelcfg
        endpoints; this PR ships the read surface + the
        change-password trigger.
      parameters:
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by `actorId` (exact match).
        - name: action
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter by `action` (exact match, e.g.
            `user.create`, `host.update`).
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
          description: |
            Filter by `resourceType` (exact match, e.g.
            `user`, `host`, `inbound`).
        - name: resource_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by `resourceId` (exact match).
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            RFC3339 timestamp. Entries with
            `createdAt < since` are excluded.
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: |
            RFC3339 timestamp. Entries with
            `createdAt > until` are excluded.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: |
            Maximum entries to return. The server clamps
            values above 1000 down to 1000. A value below
            1 is treated as 0 and the default cap is used.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
        '400':
          description: |
            Bad query parameter (e.g. malformed `since` /
            `until`, or `until < since`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing `audits` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /audits/{id}:
    get:
      tags: [audits]
      summary: Get a single audit entry
      description: |
        Returns a single entry by id, with the `before` /
        `after` JSONB blobs in full. The `id` is the
        bigserial from the `audit_log` table rendered
        as a string for stable cross-language parsing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The audit entry id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Missing `audits` scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such audit entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <jwt-access-token>`. Tokens are
        HS256-signed by Aegis (`iss=aegis-panel`,
        `aud=aegis-panel/v1`).

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Human-readable error message. For security reasons
            the auth endpoints collapse several failure modes
            into a single generic message; do not branch on
            the message text.

    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 0.0.0-dev
        commit:
          type: string
          example: deadbeef

    CoreListResponse:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/CoreProvider'

    CoreProvider:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: singbox
        version:
          type: string
          example: 1.8.0
        dev:
          type: boolean
          description: True when this is a development-only provider (e.g. noop).

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: aegis-dev-password

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          example: 4f2a8b...64hex
          description: |
            Opaque 32-byte hex token (64 chars lowercase). Only the
            SHA-256 hash is stored server-side.

    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_at, scopes]
      properties:
        access_token:
          type: string
          description: HS256 JWT access token. 15-min TTL.
        refresh_token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            Opaque refresh token. 30-day TTL. Single-use; rotation
            on every refresh.
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
            enum: [admin, read, write, nodes, users, subscriptions, hosts, audits]

    MeResponse:
      type: object
      required: [user_id, username, scopes]
      properties:
        user_id:
          type: string
          example: u-bootstrap
        username:
          type: string
          example: admin
        scopes:
          type: array
          items:
            type: string
            enum: [admin, read, write, nodes, users, subscriptions, hosts, audits]

    NodeState:
      type: string
      enum: [new, online, draining, offline, disabled]

    TofuPolicy:
      type: string
      enum: [reject, accept-and-append]
      description: |
        Trust-on-first-use policy for the SSH host key.

        - `reject` (default): the operator must paste the
          expected SHA256 fingerprint in `expected_fingerprint`
          before the panel will connect. Safe mode.
        - `accept-and-append`: on first contact, accept the
          server's key, append it to the panel's known_hosts,
          and continue. The fingerprint is returned in
          the response so the operator can verify it after.

    Node:
      type: object
      required: [id, name, region, state, address, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        region:
          type: string
          maxLength: 64
        state:
          $ref: '#/components/schemas/NodeState'
        address:
          type: string
          description: 'SSH endpoint (host:port) the panel uses to reach the node.'
        capacityHint:
          type: string
          maxLength: 64
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NodeCreateRequest:
      type: object
      required: [name, region, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        region:
          type: string
          minLength: 1
          maxLength: 64
        address:
          type: string
          minLength: 1
        capacityHint:
          type: string
          maxLength: 64

    NodeUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        region:
          type: string
          minLength: 1
          maxLength: 64
        address:
          type: string
        state:
          $ref: '#/components/schemas/NodeState'
        capacityHint:
          type: string
          maxLength: 64
        tags:
          type: array
          items:
            type: string

    NodeProvisionRequest:
      type: object
      description: |
        Exactly one of `ssh_private_key` or `ssh_password`
        must be set. The `ssh_password` path is the
        first-time-install UX: the operator pastes the
        VPS root password, the panel SSHes in to install
        the agent, and the agent switches to bearer-
        token auth so the password is never reused.
      properties:
        ssh_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Per-call override. Zero/omitted means "use the service-wide default (22)".
        ssh_user:
          type: string
          description: Per-call override. Empty/omitted means "use the service-wide default (root)".
        ssh_private_key:
          type: string
          format: password
          description: |
            Operator-pasted private key (PEM, no passphrase).
            The panel does NOT store this; the install is
            the only consumer. Mutually exclusive with
            `ssh_password`.
        ssh_password:
          type: string
          format: password
          description: |
            Operator's SSH login password for first-time
            auth on a fresh node. The panel does NOT
            store this; the install is the only consumer.
            The agent switches to bearer-token auth so
            the password is never reused. Mutually
            exclusive with `ssh_private_key`.
        tofu_policy:
          $ref: '#/components/schemas/TofuPolicy'
        expected_fingerprint:
          type: string
          description: |
            Operator-confirmed SHA256 fingerprint. Required
            when `tofu_policy` is `reject`; ignored when
            `accept-and-append`. Format: `SHA256:base64`.

    NodeProvisionResponse:
      type: object
      required: [node_id, new_state]
      properties:
        node_id:
          type: string
          format: uuid
        new_state:
          $ref: '#/components/schemas/NodeState'
        install_stage:
          type: string
          description: |
            Best-effort stage tag from the provisioner
            (`connect` / `upload` / `env` / `unit` /
            `verify`). Surface in the UI tooltip for the
            "retry" button.
        install_error:
          type: string
          description: Set when `new_state` is `offline`. Empty string on success.
        verify_latency:
          type: string
          description: ISO-8601 duration string (e.g. `PT2.5S`) for the systemd is-active poll.

    NodeRotatePanelKeyRequest:
      type: object
      description: |
        Body of `POST /api/v1/nodes/{id}/rotate-panel-key`.
        The endpoint is the v0.8.4 HTTP mirror of the
        v0.8.3 `aegis admin node rotate-panel-key` CLI
        (PR #184); both call the same
        `bootstrap.Service.RotatePanelKey` method.

        The operator's existing private key must
        already be in the node's
        `~/.ssh/authorized_keys` (i.e. this is the key
        they used to install the node on
        v0.3.0..v0.7.x). The panel uses it to SSH into
        the node, generates a fresh ed25519 keypair,
        pushes the public half to authorized_keys, then
        discards the operator's key from memory.

        The endpoint is the v0.3.0..v0.7.x re-provision
        escape hatch: the next time the operator runs
        `POST /api/v1/nodes/{id}/provision` on this
        node (with no auth input from the operator —
        the `authMethod: 'stored'` path), the panel
        decrypts the stored panel key and uses it for
        the install. The v0.8.x "auto-deploy"
        experience becomes available retroactively.
      required: [ssh_private_key]
      properties:
        ssh_private_key:
          type: string
          format: password
          description: |
            Operator's existing SSH private key (PEM, no
            passphrase). Required. Must already be in the
            node's `~/.ssh/authorized_keys`. The panel
            does NOT store this; the rotation is the only
            consumer.
        ssh_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            Per-call override. Zero/omitted means "use
            the service-wide default (22)".
        ssh_user:
          type: string
          description: |
            Per-call override. Empty/omitted means "use
            the service-wide default (root)".

    NodeRotatePanelKeyResponse:
      type: object
      description: |
        200 body of `POST /api/v1/nodes/{id}/rotate-panel-key`.
        The UI surfaces the `public_key_line` and
        `fingerprint` in a "rotation result" card so the
        operator can verify what is now in the node's
        `~/.ssh/authorized_keys` (compare against
        `ssh-add -L` on the operator's local box after
        the re-provision's first contact).
      required: [node_id, public_key_line, fingerprint]
      properties:
        node_id:
          type: string
          format: uuid
          description: The {id} segment the URL already had. Included for self-description.
        public_key_line:
          type: string
          description: |
            The OpenSSH authorized_keys line that was
            uploaded and appended to
            `~/.ssh/authorized_keys` on the node. Starts
            with `ssh-ed25519 `, followed by the base64
            payload, followed by the comment
            `aegis-panel@node-<nodeName>`.
        fingerprint:
          type: string
          description: |
            The canonical `SHA256:base64` SHA-256
            fingerprint of the public key. Same format
            `ssh-keygen -lf` outputs. The operator can
            compare this against `ssh-add -L` to verify
            the key is on the node.

    NodeStoredKey:
      type: object
      description: |
        200 body of `GET /api/v1/nodes/{id}/stored-key`.
        The panel decrypts
        `nodes.ssh_private_key_ciphertext` via the
        operator's age envelope, derives the public-key
        line + SHA-256 fingerprint, and returns the
        public surface. The private key never leaves
        the panel process.

        `has_stored_key` is false for `new` nodes
        that have never been installed via the
        v0.8.1+ path; the UI surfaces a "no
        stored key yet" hint in that case. The
        `key_updated_at` field is the row's
        `updated_at` — the ciphertext column has
        no independent timestamp, so the
        row-level `updated_at` is the operator's
        "is this the key I think it is" sanity
        check.

        The OpenSSH key comment
        (`aegis-panel@node-<nodeName>`) is NOT
        a separate field — it is the third
        whitespace-separated token of
        `public_key_line` (the OpenSSH
        authorized_keys format).
      required: [has_stored_key]
      properties:
        has_stored_key:
          type: boolean
          description: |
            True if the row has a stored
            ciphertext. False for `new` nodes
            that have never been installed via
            the v0.8.1+ path; the UI surfaces a
            "no stored key yet" hint in that
            case.
        public_key_line:
          type: string
          description: |
            The OpenSSH authorized_keys line
            derived from the stored ed25519
            private key. Starts with
            `ssh-ed25519 `, followed by the
            base64 payload, followed by the
            comment `aegis-panel@node-<nodeName>`.
            Omitted when `has_stored_key` is
            false.
        fingerprint:
          type: string
          description: |
            The canonical `SHA256:base64`
            SHA-256 fingerprint of the public
            key. Same format `ssh-keygen -lf`
            outputs. Omitted when
            `has_stored_key` is false.
        algorithm:
          type: string
          description: |
            The SSH key type
            (`ssh-ed25519` today; the
            provisioner is hard-coded to
            ed25519 in v0.8.1, but the field
            is in the wire shape so a future
            RSA / ECDSA path does not require a
            UI change). Omitted when
            `has_stored_key` is false.
        key_updated_at:
          type: string
          format: date-time
          description: |
            The row's `updated_at` timestamp
            (RFC 3339). The ciphertext column
            has no independent timestamp, so
            the row-level `updated_at` is the
            operator's "is this the key I think
            it is" sanity check. Omitted when
            `has_stored_key` is false.

    NodeRefreshAgentBearerRequest:
      type: object
      description: |
        v0.8.7 request body of
        `POST /api/v1/nodes/{id}/refresh-agent-bearer`.
        The body is optional; the field
        defaults are the service-wide
        `AEGIS_AGENT_SSH_USER` for `ssh_user`,
        the node's stored `Address` for the
        host + port, and 30s for `timeout`.
      properties:
        ssh_port:
          type: integer
          description: |
            Per-call SSH port override. Zero
            (omitted) means "use the node's
            stored Address (port component)".
        ssh_user:
          type: string
          description: |
            Per-call SSH user override. Empty
            (omitted) means "use the
            service-wide default
            (cfg.AgentSSHUser)".

    NodeRefreshAgentBearerResponse:
      type: object
      description: |
        v0.8.7 200 body of
        `POST /api/v1/nodes/{id}/refresh-agent-bearer`.
        The `bearer` field is the new agent
        bearer (what the panel will use for
        subsequent `POST /v1/apply` calls to
        the agent); the operator can verify it
        on the node by `cat`-ing
        `/etc/aegis/agent.env`. The
        `key_fingerprint` is the SHA-256 of
        the public key derived from the stored
        private key (same string `ssh-keygen
        -lf` reports), so the operator can
        verify the refresh used the key they
        expect.
      required: [node_id, bearer, key_fingerprint]
      properties:
        node_id:
          type: string
          format: uuid
          description: The node UUID (the path's `{id}` echoed back).
        bearer:
          type: string
          description: |
            The new agent bearer (the
            `AEGIS_AGENT_BEARER` value from
            `/etc/aegis/agent.env` on the
            node). The panel writes this to
            `nodes.agent_bearer` for use in
            subsequent `POST /v1/apply` calls.
        key_fingerprint:
          type: string
          description: |
            The canonical `SHA256:base64`
            SHA-256 fingerprint of the public
            key derived from the stored
            private key. Same string
            `ssh-keygen -lf` reports.

